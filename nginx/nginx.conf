worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Limit payload size (adjust as needed if uploading files)
    client_max_body_size 10M;

    upstream flask_app {
        # The 'web' hostname matches the service name in docker-compose.yml
        server web:8010;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Serve static files directly via Nginx per performance ottimale
        # Assicurati di montare il volume static anche nel container nginx se lo fai
        # Per ora lo facciamo servire da Flask (Gunicorn) passando per proxy per semplicità,
        # ma in produzione si può configurare una location apposita.
    }
}
