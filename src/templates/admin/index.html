<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - DASHBOARD</title>

    <link rel="stylesheet" href="/html/admin/style.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js" defer></script>
    <script src="/html/admin/script.js" defer></script>
    <script>
        const userName = "{{ username }}";
        const mail = "{{ user_id }}";
    </script> 
</head>
<body>
    <header>
        <h1 id="greeting">ADMIN DASHBOARD</h1>
        <nav>
            <ul>
                <li><a href="/admin/editTutors">Modifica Tutor</a></li>
                <li><a href="/logout">Logout</a></li>
                <li><a href="/admin/seeEvents">Vedi eventi</a></li>
                <li><a href="/notifiche/pagina" class="notifiche-link">Notifiche <span id="notifiche-badge" class="notifiche-badge" style="display:none;">0</span></a></li>
                <li class="version-display">v{{ versione_servizio }}</li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Pop-up notifiche -->
        <div id="notifiche-popup-overlay" class="notifiche-popup-overlay">
            <div class="notifiche-popup">
                <h3>Nuove notifiche</h3>
                <p id="notifiche-popup-text">Hai nuove notifiche da leggere.</p>
                <div class="notifiche-popup-actions">
                    <button onclick="window.location.href='/notifiche/pagina'">Vai alle notifiche</button>
                    <button class="btn-secondary" onclick="document.getElementById('notifiche-popup-overlay').classList.remove('visible')">Chiudi</button>
                </div>
            </div>
        </div>

        <div id="modal-overlay" class="modal"> 
            <div id="event-modal" class="modal-content"> 
                <h3 id="modal-header"></h3> 
                <ul id="event-list"></ul> 
                <button id="close-modal">Chiudi</button> 
            </div> 
        </div>

        <section>
            <h3>IMPOSTAZIONI SERVIZIO</h3>
            <div style="margin-top: 10px;">
                <span id="servizio-status-label" style="font-size: 1em; margin-right: 15px; display: none;"></span>
                <button id="servizio-toggle-btn" style="display: none;">...</button>
            </div>
        </section>

        <section>
            <div id="unvalidated-events-header">
                <h3>LEZIONI DA VALIDARE</h3>
                <button id="validate-all">VALIDA TUTTO</button>
            </div>
            
            <ul id="unvalidated-events-list" class="cardList"></ul>
        </section>

        <div id="calendar"></div>
    </main>
    <script>
        // Controllo notifiche al login
        fetch('/notifiche/count')
            .then(res => res.json())
            .then(data => {
                if (data.count > 0) {
                    document.getElementById('notifiche-badge').textContent = data.count;
                    document.getElementById('notifiche-badge').style.display = 'inline-flex';
                    document.getElementById('notifiche-popup-text').textContent = 
                        'Hai ' + data.count + ' nuov' + (data.count === 1 ? 'a' : 'e') + ' notific' + (data.count === 1 ? 'a' : 'he') + ' da leggere.';
                    document.getElementById('notifiche-popup-overlay').classList.add('visible');
                }
            })
            .catch(err => console.error('Errore check notifiche:', err));
    </script>
</body>
</html>
